name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database. The test session rebuilds the reporting schema from
      # supabase/tests/supabase_stub.sql plus every migration.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGA_TEST_PLAIN_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv pip install --system -e '.[dev]'

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (includes RLS isolation tests)
        run: pytest
